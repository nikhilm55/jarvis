<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis HUD</title>
<style>
:root{
  --canvas:#07080a; --surface:#0d0d0d; --elevated:#101111; --card:#121212;
  --hairline:#242728; --hairline-soft:rgba(255,255,255,.08); --hairline-strong:rgba(255,255,255,.16);
  --ink:#f4f4f6; --body:#cdcdcd; --mute:#9c9c9d; --ash:#6a6b6c;
  --primary:#ffffff; --primary-pressed:#e8e8e8; --on-primary:#000000;
  --blue:#57c1ff;   --blue-soft:rgba(87,193,255,.15);
  --green:#59d499;  --green-soft:rgba(89,212,153,.15);
  --yellow:#ffc533; --yellow-soft:rgba(255,197,51,.15);
  --red:#ff6161;    --red-soft:rgba(255,97,97,.15);
  --think:rgba(255,255,255,.72);
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:16px; --r-full:9999px;
}
*{box-sizing:border-box}
@font-face{font-family:Inter;src:url(/fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}
.orb{position:relative;width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.orb::before{content:"";position:absolute;inset:0;border-radius:var(--r-full);border:1px solid var(--orb-ring)}
.orb::after{content:"";width:18px;height:18px;border-radius:var(--r-full);background:var(--orb)}
.orb.listen{--orb:var(--blue);--orb-ring:rgba(87,193,255,.4)}
.orb.think{--orb:var(--think);--orb-ring:var(--hairline-strong)}
.orb.confirm{--orb:var(--yellow);--orb-ring:rgba(255,197,51,.4)}
.orb.error{--orb:var(--red);--orb-ring:rgba(255,97,97,.4)}
.orb.idle{--orb:var(--ash);--orb-ring:transparent;width:10px;height:10px}
.orb.idle::after{width:8px;height:8px}
.orb.listen::before{animation:ring 1.6s ease-out infinite}
.orb.think::after{animation:breathe 1.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--blue);animation:wave 1.1s ease-in-out infinite;transform-origin:center}
.wave i:nth-child(1){height:10px}.wave i:nth-child(2){height:18px;animation-delay:.1s}.wave i:nth-child(3){height:24px;animation-delay:.2s}
.wave i:nth-child(4){height:14px;animation-delay:.3s}.wave i:nth-child(5){height:20px;animation-delay:.4s}.wave i:nth-child(6){height:8px;animation-delay:.5s}
@keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.pill{display:flex;align-items:center;gap:14px;padding:10px 20px 10px 12px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-full)}
.pill .text{flex:1;font-size:15px;line-height:1.4;min-width:0}
.pill .label{font-size:12px;color:var(--mute);white-space:nowrap}
.hud-zone{position:absolute;left:0;right:0;bottom:32px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;z-index:2}
.hud-zone > *{width:100%;max-width:580px}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"calt","kern","liga","ss03";font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.hud-zone{opacity:0;transform:translateY(8px);transition:opacity .18s ease-out,transform .18s ease-out;pointer-events:none}
.hud-zone.on{opacity:1;transform:none}
.hud-zone > .pill.compact{width:auto;padding:6px 12px;gap:8px}
.pill .text:empty{display:none}
.pill #pill-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wave.live i{animation:none;transform:scaleY(calc(.25 + var(--lvl,0) * .75))}
.pill .label.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xl)}
.hud-card{padding:20px 22px;display:flex;flex-direction:column;gap:14px;pointer-events:auto}
.hud-card[hidden]{display:none}
.hud-card .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hud-card .title{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
.hud-card .actions{display:flex;flex-wrap:wrap;gap:8px}
.hud-card .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--hairline);font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1.5;padding:2px 8px;border-radius:var(--r-xs);white-space:nowrap}
.b-neutral{background:var(--elevated);color:var(--body);border:1px solid var(--hairline)}
.b-yellow{background:var(--yellow-soft);color:var(--yellow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-md);font-size:14px;font-weight:500;letter-spacing:.2px;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
.btn[hidden]{display:none}
.btn-primary{background:var(--primary);color:var(--on-primary);border:0}
.btn-primary:active{background:var(--primary-pressed)}
.btn-ghost{background:transparent;border:1px solid var(--hairline)}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:var(--r-sm)}
.control{pointer-events:auto}
.control[hidden]{display:none}
.quote{padding:10px 14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--hairline);color:var(--ink);font-size:15px}
.quote[hidden]{display:none}
.input{height:36px;padding:0 12px;border-radius:var(--r-md);background:var(--elevated);border:1px solid var(--hairline);font-size:14px;outline:none;color:var(--ink);font-family:inherit}
.input:focus{border-color:var(--hairline-strong)}
.input::placeholder{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-xs);background:linear-gradient(#121212,#0d0d0d);border:1px solid var(--hairline);color:var(--body);font:500 12px/1 Inter,system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){.orb::before,.orb::after,.wave i,.pill .label.pulse{animation:none!important}.hud-zone{transition:none}.wave.live i{transform:scaleY(calc(.25 + var(--lvl,0) * .75))}}
</style>
</head>
<body>
<div class="hud-zone" id="zone">
  <div class="card hud-card" id="card" role="alertdialog" aria-labelledby="card-title" hidden>
    <div class="top">
      <div class="title"><div class="orb confirm" aria-hidden="true"></div><span id="card-title"></span></div>
      <span class="badge b-yellow" id="card-badge"></span>
    </div>
    <div class="quote" id="card-phrase" hidden></div>
    <div class="actions">
      <button class="btn btn-primary" id="card-yes" type="button">Confirm</button>
      <button class="btn btn-ghost" id="card-no" type="button">Cancel</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <label class="sr" for="card-typed">Type your answer</label>
      <input class="input" id="card-typed" style="flex:1;min-width:0" autocomplete="off" maxlength="200">
      <span style="display:flex;gap:4px" id="card-keys" aria-label="Keyboard shortcuts"></span>
    </div>
    <div class="foot"><span id="card-say"></span><span>No answer in 15 s = no</span></div>
  </div>
  <div class="pill control" id="control" role="status" aria-live="assertive" hidden>
    <div class="orb think" aria-hidden="true"></div>
    <span class="text" id="control-text"></span>
    <button class="btn btn-sm btn-ghost" id="control-stop" type="button">Stop</button>
  </div>
  <div class="pill compact" id="pill" role="status" aria-live="polite">
    <div class="orb idle" id="pill-orb" aria-hidden="true"></div>
    <div class="wave" id="pill-wave" aria-hidden="true" style="display:none"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="text" id="pill-text"></span>
    <span class="label" id="pill-label"></span>
  </div>
</div>
<script>
const HIDE_MS = 4000;          // FR-UI-01: hide 4 s after the turn ends
const WATCHDOG_MS = 30000;     // a state that never ends is hidden anyway
/* LOOKS */
const LOOKS = {
  idle:       { orb: 'idle',    wave: false, label: 'Say “Jarvis…”', compact: true, hide: true },
  listening:  { orb: 'listen',  wave: true,  label: 'Listening' },
  transcript: { orb: 'listen',  wave: true,  label: 'Listening', quote: true },
  thinking:   { orb: 'think',   wave: false, label: 'Thinking…' },
  acting:     { orb: 'think',   wave: false, label: 'Working…' },
  speaking:   { orb: 'listen',  wave: true,  label: 'Speaking' },
  error:      { orb: 'error',   wave: false, label: 'Something went wrong', hide: true },
  reply:      { orb: 'confirm', wave: false, label: 'Reply…', pulse: true, hide: true },
  confirm:    { orb: 'confirm', wave: false, label: 'Confirm?', pulse: true },
  controlling:{ orb: 'think',   wave: false, label: 'Working…' }
};
/* END LOOKS */
/* CARD LOGIC: no DOM here, so tests run it under node */
function cardModel(extra) {
  const kind = extra.kind;
  const phrase = typeof extra.phrase === 'string' && extra.phrase ? extra.phrase : 'confirm';
  if (kind === 'click') {
    return { badge: 'Needs a click', yes: true, phrase: '', keys: ['N'],
             placeholder: 'Or type: no', say: 'Click Confirm to go ahead · or say “no”' };
  }
  if (kind === 'guardrail') {
    return { badge: 'Say it to confirm', yes: false, phrase: phrase, keys: ['N'],
             placeholder: 'Or type: ' + phrase, say: 'Say “' + phrase + '” or “no”' };
  }
  return { badge: 'Confirm', yes: true, phrase: '', keys: ['Y', 'N'],
           placeholder: 'Or type: yes or no', say: 'Or just say “yes” or “no”' };
}
function keyAnswer(key, kind) {
  if (key === 'n' || key === 'N' || key === 'Escape') return 'no';
  if ((key === 'y' || key === 'Y') && kind !== 'click' && kind !== 'guardrail') return 'yes';
  return null;
}
/* END CARD LOGIC */
const zone = document.getElementById('zone');
const pill = document.getElementById('pill');
const orb = document.getElementById('pill-orb');
const wave = document.getElementById('pill-wave');
const text = document.getElementById('pill-text');
const label = document.getElementById('pill-label');
const card = document.getElementById('card');
const typed = document.getElementById('card-typed');
let cardKind = null;
const control = document.getElementById('control');
function windowMode() {
  // R82: the window takes clicks only over the card or the Stop bar while one shows, and keys
  // only for the card. The Stop bar never takes focus: Jarvis may be typing into another app.
  const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hud;
  if (!handler) return;
  const el = !card.hidden ? card : (!control.hidden ? control : null);
  const r = el ? el.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
  handler.postMessage(JSON.stringify({
    interactive: el !== null,
    focus: el === card,
    rect: [r.left, r.top, r.width, r.height],
    scale: window.devicePixelRatio || 1
  }));
}
function showControl(ev) {
  if ((ev.extra || {}).closed) {
    if (control.hidden) return;
    control.hidden = true;
  } else {
    document.getElementById('control-text').textContent = ev.text || '';
    control.hidden = false;
  }
  windowMode();
}
document.getElementById('control-stop').addEventListener('click', function () {
  fetch('/stop', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(function () {});
});
function openCard(ev) {
  const model = cardModel(ev.extra || {});
  cardKind = (ev.extra || {}).kind || 'voice';
  document.getElementById('card-title').textContent = ev.text || '';
  document.getElementById('card-badge').textContent = model.badge;
  const quote = document.getElementById('card-phrase');
  quote.textContent = model.phrase;
  quote.hidden = !model.phrase;
  document.getElementById('card-yes').hidden = !model.yes;
  document.getElementById('card-say').textContent = model.say;
  const keys = document.getElementById('card-keys');
  keys.replaceChildren(...model.keys.map(function (k) {
    const el = document.createElement('kbd');
    el.textContent = k;
    return el;
  }));
  typed.value = '';
  typed.placeholder = model.placeholder;
  card.hidden = false;
  windowMode();  // getBoundingClientRect lays out now; an idle view may never run rAF
}
function closeCard() {
  if (card.hidden) return;
  card.hidden = true;
  cardKind = null;
  windowMode();
}
async function answer(text, method) {
  try {
    await fetch('/answer', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer: text, method: method })
    });
  } catch (e) {
    // the question may have closed; the voice path still works
  }
}
document.getElementById('card-yes').addEventListener('click', function () { answer('yes', 'button'); });
document.getElementById('card-no').addEventListener('click', function () { answer('no', 'button'); });
typed.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && typed.value.trim()) { answer(typed.value.trim(), 'typed'); e.preventDefault(); }
  else if (e.key === 'Escape') { answer('no', 'key'); e.preventDefault(); }
  e.stopPropagation();
});
document.addEventListener('keydown', function (e) {
  if (card.hidden) return;
  const a = keyAnswer(e.key, cardKind);
  if (a) { answer(a, 'key'); e.preventDefault(); }
});
let timer = 0;
function hide() {
  zone.classList.remove('on');
}
function render(ev) {
  if (!Object.hasOwn(LOOKS, ev.state)) return;
  if (ev.state === 'confirm') {
    if ((ev.extra || {}).closed) { closeCard(); return; }
    openCard(ev);
  }
  if (ev.state === 'controlling') { showControl(ev); return; }
  const look = LOOKS[ev.state];
  const extra = ev.extra || {};
  orb.className = 'orb ' + look.orb;
  wave.style.display = look.wave ? 'flex' : 'none';
  pill.classList.toggle('compact', !!look.compact);
  const raw = ev.state === 'idle' ? '' : (ev.text || '');
  text.textContent = look.quote && raw ? '“' + raw + '”' : raw;
  let lbl = look.label;
  let pulse = !!look.pulse;
  if (extra.window === 'reply') { lbl = 'Reply…'; pulse = true; }
  else if (ev.state === 'acting' && typeof extra.step === 'number' && typeof extra.steps === 'number') {
    lbl = 'Step ' + extra.step + ' of ' + extra.steps;
  }
  else if (ev.state === 'error' && typeof extra.remedy === 'string' && extra.remedy) {
    lbl = extra.remedy;
  }
  label.textContent = lbl;
  label.classList.toggle('pulse', pulse);
  if (look.wave && typeof extra.level === 'number') {
    const level = Math.max(0, Math.min(1, extra.level));
    wave.classList.add('live');
    wave.style.setProperty('--lvl', String(level));
  } else {
    wave.classList.remove('live');
  }
  zone.classList.add('on');
  clearTimeout(timer);
  timer = setTimeout(hide, look.hide ? HIDE_MS : WATCHDOG_MS);
}
const token = decodeURIComponent(location.hash.slice(1));
let delay = 500;
async function connect() {
  for (;;) {
    try {
      const res = await fetch('/events', {
        headers: { Authorization: 'Bearer ' + token, Accept: 'text/event-stream' }
      });
      if (res.status === 401 || res.status === 403) return;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      delay = 500;
      const reader = res.body.getReader();
      const dec = new TextDecoder('utf-8');
      let buf = '';
      for (;;) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const msg = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const data = msg.split('\n').filter(function (l) {
            return l.indexOf('data:') === 0;
          }).map(function (l) {
            return l.slice(5).replace(/^ /, '');
          }).join('');
          if (!data) continue;
          try {
            render(JSON.parse(data));
          } catch (e) {
            // skip malformed payloads
          }
        }
      }
    } catch (e) {
      // stream ended or fetch threw; fall through to reconnect
    }
    await new Promise(function (r) { setTimeout(r, delay); });
    delay = Math.min(5000, delay * 2);
  }
}
connect();
</script>
</body>
</html>

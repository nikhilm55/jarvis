[project]
name = "jarvis"
version = "0.0.1"
description = "Voice control for your whole PC — say \"Jarvis, …\" and it gets done."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nikhil Malhotra", email = "nikhil.malhotra@fiftyfivetech.io" }]
dependencies = []

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

# ── Lint / format ──────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913"]
".claude/hooks/**" = ["S603", "S607", "E501"]  # one-line veto messages read best
"scripts/**" = ["S603", "S607"]
"spikes/**" = ["S603", "S607", "S101", "E501", "T201"]  # throwaway measurement code

# ── Types ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", ".claude/hooks"]
files = ["src", "scripts", ".claude/hooks", "tests"]
explicit_package_bases = true

# ── Tests ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
